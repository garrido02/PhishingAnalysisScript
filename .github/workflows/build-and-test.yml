name: Build and Test Phishing Analytics

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: write

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system dependencies (Tkinter)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pytest flake8

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests with pytest
        run: |
          pytest

  build:
    name: Build Windows Executable
    needs: test
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas openpyxl pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm --onefile --windowed --name PhishingAnalytics physhing_analysis_exe_version.py

      # Mantemos o Artifact para download temporário (opcional, podes apagar se quiseres só a Release)
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhishingAnalytics-Windows-EXE
          path: dist/PhishingAnalytics.exe

      # Cria a Release AUTOMATICAMENTE a cada commit usando o número da execução
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Auto-Release Build ${{ github.run_number }}
          files: dist/PhishingAnalytics.exe
          generate_release_notes: true
